<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>demo</title>
</head>
<body>
<form action="#">
 <input type="hidden" name="hide" />
 <div>
<label for="query">Введите запрос</label>
 <input 
 type="text" 
 placeholder="запрос" 
 id="query" 
 name="search_query"
 value="test@example.ru" />
 </div>
 <div>
    <input type="checkbox" name="agree" id="agree">
    <label for="agree"> Согласен с обработкой данных</label>
 </div>
  <div>
    <input type="radio" name="search" id="all" value="all">
    <label for="all"> Поиск по всюду </label>
 </div>
   <div>
       <input type="radio" name="search" id="youtube" value="youtube">
       <label for="youtube"> Поиск на Youtube </label>
 <div>
     <select name="topic" id="topic">
     <label for="topic">Тематика</label>
     <optgroup label="Популярные">
     <option value="1">Все</option>
     <option value="2">Животные</option>
     <option value="3" selected >Разработка</option>
     </optgroup>
    </select>
    </div>
    <label for "num">Громкость
</label>
<div>
<input 
type="range"
name="volume"
id="volume"
min="0"
max="10"
step="2"
/>
<div>
    <label for="num">Оценка</label>
    <input 
type="number"
name="num"
id="num"
min="0"
max="5"
step="1"
/>
<div>
 <button type="submit">Искать на Youtube </button>
 <button type="reset">Сброc</button>

    </form>
