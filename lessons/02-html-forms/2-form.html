<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<h1>Регистрация</h1>
<span>Уже есть аккаунт?</span>
<a href="#">Войти</a>
<span>Моя компания</span>
<form action="/registration" 
method="post">
<input 
type="text" 
placeholder="Имя" 
name="write_name" 
id="write_name"
/>
<input type="text" 
placeholder="Фамилия" 
name="write_second_name" 
id="write_second_name"
/>
<input 
type="email" 
placeholder="E-mail" 
name="email" 
id="email"
/>
<button type="submit">Зарегистрироваться &rarr;</button>
<input 
type="checkbox" 
name="agree" 
id="agree" 
required
/>
<label 
for="agree"> Согласен с обработкой данных
</label>
<a href="#">Условия пользования</a>
</form>
</body>
</html>
